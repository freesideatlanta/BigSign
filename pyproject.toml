[project]
name = "freeside-bigsign"
version = "0.1.0"
description = "A digital sign for Freeside Atlanta Meetup and Discord events"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3,<5",
    "discord.py>=2.7.1,<3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.32.5,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "ty>=0.0.84",
    "types-requests>=2.33.0.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
extend-exclude = ["myenv"]

[tool.ruff.lint]
select = ["ANN", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.src]
exclude = ["myenv"]

[tool.ty.rules]
all = "error"
