<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freeside Atlanta — Upcoming Events</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Limelight&family=Space+Grotesk:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap');

  :root {
    --bg:        #e4e9eb;
    --surface:   #f3f5f6;
    --border:    #bcc7cc;
    --accent:    #15212a;
    --accent2:   #245c32;  /* free-event green */
    --text:      #15212a;
    --muted:     #46535c;
    --paid:      #79500b;
    --group-bg:  #cdd7dc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }
  /* Hide the kiosk cursor automatically, without requiring a user gesture. */
  * {
    cursor: none !important;
  }
  /* ── HEADER ─────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 18px 36px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  .logo-text {
    font-family: 'Limelight', serif;
    font-weight: 400;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  .logo-sub {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .header-right {
    margin-left: auto;
    text-align: right;
  }

  .clock {
    font-family: 'Ubuntu Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 4.5rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .date-display {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 3px;
  }

  /* ── SCROLL CONTAINER ────────────────────────────────────── */
  .scroll-wrapper {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  .scroll-track {
    display: flex;
    flex-direction: column;
    gap: 0;
    will-change: transform;
  }

  /* ── EVENT CARD ──────────────────────────────────────────── */
  .event-card {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr) auto;
    align-items: center;
    gap: 0 24px;
    padding: 16px 36px;
    border-bottom: 1px solid var(--border);
    transition: background 0.2s;
    min-height: 90px;
  }

  .event-card { background: var(--surface); }

  /* event image fades into the date */
  .event-visual {
    position: relative;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: 74px;
  }

  .event-image {
    position: absolute;
    inset: -16px auto -16px -36px;
    width: 200px;
    height: calc(100% + 32px);
    object-fit: cover;
    -webkit-mask-image: linear-gradient(to right, #000 25%, transparent 100%);
    mask-image: linear-gradient(to right, #000 25%, transparent 100%);
  }

  /* date block */
  .event-date-block {
    position: relative;
    z-index: 1;
    width: 96px;
    text-align: center;
    flex-shrink: 0;
  }

  .event-dow {
    font-family: 'Ubuntu Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  .event-day {
    font-family: 'Ubuntu Mono', monospace;
    font-size: 2.4rem;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
  }

  .event-month {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-top: 1px;
  }

  /* main info */
  .event-info { min-width: 0; }

  .event-title {
    font-size: 1.25rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .event-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 1rem;
    color: var(--muted);
    font-family: 'Ubuntu Mono', monospace;
  }

  .meta-item svg {
    flex-shrink: 0;
    opacity: 0.6;
  }

  /* badge */
  .event-badge {
    flex-shrink: 0;
    text-align: right;
  }

  .badge {
    display: inline-block;
    font-family: 'Ubuntu Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 4px 10px;
    border-radius: 2px;
  }

  .badge.free {
    background: var(--accent2);
    color: #fff;
  }

  .badge.paid {
    background: transparent;
    border: 1px solid var(--paid);
    color: var(--paid);
  }

  .attendee-count {
    font-family: 'Ubuntu Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 5px;
    text-align: right;
  }

  /* ── DATE SEPARATOR ──────────────────────────────────────── */
  .date-sep {
    padding: 8px 36px 6px;
    background: var(--group-bg);
    border-bottom: 2px solid var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .date-sep-label {
    font-family: 'Ubuntu Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    white-space: nowrap;
  }

  .date-sep-line {
    flex: 1;
    height: 1px;
    background: var(--muted);
  }

  /* Connection details remain available while data refreshes. */
  footer {
    padding: 8px 36px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    overflow-wrap: anywhere;
  }

  #wifiDetails:not([hidden]) {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 24px;
  }

  .wifi-copy {
    font-size: 1rem;
    line-height: 1.5;
  }

  .wifi-heading {
    font-size: 1.8rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .wifi-fields {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    column-gap: 12px;
  }

  .wifi-value {
    font-family: 'Ubuntu Mono', monospace;
    font-weight: 700;
  }

  .wifi-qr { flex-shrink: 0; }
  #errorFooter {
    color: #8f2331;
    min-height: 1.4em;
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .empty-state {
    padding: 48px 36px;
    text-align: center;
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1.5;
  }

  /* ── LAYOUT ──────────────────────────────────────────────── */
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  html.portrait body {
    position: absolute;
    width: 100vh;
    height: 100vw;
    transform-origin: top left;
    transform: translateX(100vw) rotate(90deg);
  }
</style>
</head>

  <div id="errorFooter" role="status" aria-live="polite"></div>
</footer>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const DISPLAY_TIME_ZONE = 'America/New_York';
const JSON_PATH = 'eventsdata.json';   // same folder as this HTML
const REFRESH_MS  = 60 * 60 * 1000;   // 1 hour
const MAX_DATA_AGE_MS = 2 * REFRESH_MS;
const SCROLL_PPS  = 150;              // slower transition between reading positions
const SCROLL_PPS_UP = 1000;             // pixels per second (scroll up)
const READING_PAUSE_MS = 10000;       // hold each group of rows for reading

// ── STATE ─────────────────────────────────────────────────────
let events = [];
let collectedAt = null;
let scrollY = 0;
let scrollRAF = null;
let lastTs = null;
let pausing = true;
let pauseTimer = null;
let totalHeight = 0;
let visibleHeight = 0;
let scrollStops = [0];

// ── CLOCK ─────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US', {timeZone: DISPLAY_TIME_ZONE, hour: 'numeric', minute: '2-digit', hour12: true});
  document.getElementById('datedisp').textContent =
    now.toLocaleDateString('en-US', {timeZone: DISPLAY_TIME_ZONE, weekday:'long', month:'long', day:'numeric'});
}
setInterval(updateClock, 1000);
updateClock();

// ── ERROR DISPLAY ────────────────────────────────────────────
function showError(error) {
  const footer = document.getElementById('errorFooter');
  console.error('Sign error:', error);
  footer.textContent = 'Events could not be refreshed: ' + (error?.message || String(error)) + '. ' +
    (events.length ? 'Showing the last available schedule.' : 'Please check back shortly.');
  getHeights();
}

function clearError() {
  const footer = document.getElementById('errorFooter');
  footer.textContent = '';
}

window.addEventListener('error', event => showError(event.error || event.message));
window.addEventListener('unhandledrejection', event => showError(event.reason));

// ── DATA FETCH ────────────────────────────────────────────────
async function fetchEvents() {
  const r = await fetch(JSON_PATH + '?_=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('Failed to load events: HTTP ' + r.status);
  const data = await r.json();
  const timestamp = Date.parse(r.headers.get('Last-Modified'));
  if (!Number.isFinite(timestamp)) throw new Error('Event collection timestamp is missing or invalid');
  if (!Array.isArray(data)) throw new Error('Event data must be an array');
  data.forEach(ev => {
    if (!ev || typeof ev.index !== 'number' || !Number.isFinite(ev.index) ||
        !Number.isFinite(new Date(ev.index * 1000).getTime())) {
      throw new RangeError('Invalid time value in event data');
    }
    if (typeof ev.title !== 'string' || typeof ev.time !== 'string' ||
        typeof ev.free !== 'boolean' || !Number.isInteger(ev.attendees) ||
        !(ev.image_url == null || typeof ev.image_url === 'string')) {
      throw new Error('Invalid event fields');
    }
  });
  // sort by index (unix timestamp) ascending, filter past events
  const now = Date.now() / 1000;
  const nextEvents = data
    .filter(e => e.index >= now - 3600) // keep events starting up to 1hr ago
    .sort((a, b) => a.index - b.index);
  return { events: nextEvents, collectedAt: timestamp };
}

function checkFreshness() {
  if (collectedAt !== null && Date.now() - collectedAt > MAX_DATA_AGE_MS) {
    document.getElementById('errorFooter').textContent =
      'Event data is over two hours old. Showing the last available schedule.';
    getHeights();
  }
}

// ── RENDER ────────────────────────────────────────────────────
function buildCards(nextEvents = events) {
  const track = document.getElementById('scrollTrack');
  const fragment = document.createDocumentFragment();

  if (!nextEvents.length) {
    events = nextEvents;
    showEmptyState('No upcoming events. Check back soon!');
    return;
  }

  let lastDate = null;
  const dateFormatter = new Intl.DateTimeFormat('en-US', {
    timeZone: DISPLAY_TIME_ZONE, weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
  });

  nextEvents.forEach(ev => {
    const d = new Date(ev.index * 1000);
    const parts = Object.fromEntries(dateFormatter.formatToParts(d).map(part => [part.type, part.value]));
    const dateKey = `${parts.year}-${parts.month}-${parts.day}`;

    if (dateKey !== lastDate) {
      lastDate = dateKey;
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.innerHTML = `
        <span class="date-sep-label">${parts.weekday}, ${parts.month} ${parts.day}</span>
        <span class="date-sep-line"></span>`;
      fragment.appendChild(sep);
    }

    const card = document.createElement('div');
    card.className = 'event-card ' + (ev.free ? 'free' : 'paid');

    const day = parts.day;
    const dow = parts.weekday.slice(0,3).toUpperCase();
    const mon = parts.month.toUpperCase();

    card.innerHTML = `
      <div class="event-visual">
        <div class="event-date-block">
          <div class="event-dow">${dow}</div>
          <div class="event-day">${String(day).padStart(2,'0')}</div>
          <div class="event-month">${mon}</div>
        </div>
      </div>
      <div class="event-info">
        <div class="event-title"></div>
        <div class="event-meta">
          <span class="meta-item event-time">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="event-time-text"></span>
          </span>
        </div>
      </div>
      <div class="event-badge">
        <span class="badge ${ev.free ? 'free' : 'paid'}">${ev.free ? 'FREE' : 'PAID'}</span>
        ${ev.attendees > 0 ? '<div class="attendee-count"></div>' : ''}
      </div>`;

    card.querySelector('.event-title').textContent = ev.title;
    card.querySelector('.event-time-text').textContent = formatEventTime(ev.time);
    if (ev.image_url) {
      const image = document.createElement('img');
      image.className = 'event-image';
      image.alt = '';
      image.addEventListener('error', () => {
        image.hidden = true;
        console.warn('Failed to load event image for ' + ev.title);
      });
      image.src = ev.image_url;
      card.querySelector('.event-visual').appendChild(image);
    }
    if (ev.attendees > 0) {
      card.querySelector('.attendee-count').textContent = `${ev.attendees} going`;
    }
    fragment.appendChild(card);
  });
  track.replaceChildren(fragment);
  events = nextEvents;
}

function showEmptyState(message) {
  const state = document.createElement('div');
  state.className = 'empty-state';
  state.textContent = message;
  const track = document.getElementById('scrollTrack');
  track.innerHTML = '';
  track.appendChild(state);
}

function formatEventTime(time) {
  // Normalize collector strings such as "06:30PM" without changing other formats.
  return time.replace(/\b0?(\d{1,2}):(\d{2})\s*(AM|PM)\b/gi,
    (_, hour, minute, period) => `${Number(hour)}:${minute} ${period.toUpperCase()}`);
}

// ── SCROLL LOOP ───────────────────────────────────────────────
function getHeights() {
  const wrapper = document.getElementById('scrollWrapper');
  const track   = document.getElementById('scrollTrack');
  visibleHeight = wrapper.clientHeight;
  totalHeight   = track.scrollHeight;
  const maxScroll = Math.max(0, totalHeight - visibleHeight);
  const stepHeight = visibleHeight * 0.5;
  // Advance about half a screen, keeping a date heading with its first event.
  const boundaries = Array.from(track.children)
    .filter((child, index, children) =>
      child.className === 'date-sep' ||
      (child.className.startsWith('event-card') && children[index - 1]?.className !== 'date-sep'))
    .map(child => child.offsetTop)
    .filter(offset => offset > 0 && offset <= maxScroll);
  scrollStops = [0];
  while (scrollStops.at(-1) < maxScroll && visibleHeight > 0) {
    const current = scrollStops.at(-1);
    const candidates = boundaries.filter(offset => offset > current && offset <= current + stepHeight);
    const next = candidates.at(-1) ?? Math.min(current + stepHeight, maxScroll);
    scrollStops.push(next);
  }
  scrollY = Math.min(scrollY, maxScroll);
  track.style.transform = `translateY(-${scrollY}px)`;
}

let scrollDir = 1; // 1 = down, -1 = up

function pauseThenScroll(dir) {
  pausing = true;
  scrollDir = dir;
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(() => { pausing = false; }, READING_PAUSE_MS);
}

function resetScroll() {
  scrollY = 0;
  document.getElementById('scrollTrack').style.transform = 'translateY(0px)';
  pauseThenScroll(1);
}

function scrollStep(ts) {
  if (!lastTs) lastTs = ts;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;

  if (!pausing && totalHeight > visibleHeight) {
    const speed = scrollDir === 1 ? SCROLL_PPS : SCROLL_PPS_UP;
    const maxScroll = Math.max(0, totalHeight - visibleHeight);
    const target = scrollDir === 1
      ? (scrollStops.find(stop => stop > scrollY) ?? maxScroll)
      : 0;
    scrollY += speed * dt * scrollDir;
    if (scrollDir === 1 && scrollY >= target) {
      scrollY = target;
      pauseThenScroll(target === maxScroll ? -1 : 1);
    } else if (scrollDir === -1 && scrollY <= 0) {
      scrollY = 0;
      pauseThenScroll(1);
    }
    document.getElementById('scrollTrack').style.transform = `translateY(-${scrollY}px)`;
  }

  scrollRAF = requestAnimationFrame(scrollStep);
}

// ── INIT & REFRESH ────────────────────────────────────────────
async function init() {
  try {
    const snapshot = await fetchEvents();
    buildCards(snapshot.events);
    collectedAt = snapshot.collectedAt;
    clearError();
    checkFreshness();
    getHeights();
    resetScroll();
    cancelAnimationFrame(scrollRAF);
    lastTs = null;
    scrollRAF = requestAnimationFrame(scrollStep);
  } catch (err) {
    console.error('Failed to update sign:', err);
    if (!document.getElementById('scrollTrack').children.length) {
      showEmptyState('Events are temporarily unavailable.');
    }
    showError(err);
  }
}

// Hourly refresh
setInterval(init, REFRESH_MS);
setInterval(checkFreshness, 60 * 1000);

window.addEventListener('resize', getHeights);
document.fonts?.ready.then(getHeights);

init();
</script>
</body>
</html>
